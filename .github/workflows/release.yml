name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gates:
    name: Gates (lint, typecheck, unit, e2e)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build desktop
        run: pnpm -C packages/desktop build

      - name: E2E smoke tests
        run: pnpm -C packages/desktop test:e2e

      - name: Upload E2E failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: tyvox-macos
            pack_script: pack:mac
          - os: ubuntu-latest
            artifact_name: tyvox-linux
            pack_script: pack:linux
          - os: windows-latest
            artifact_name: tyvox-windows
            pack_script: pack:win

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tyvox.p12"
          security create-keychain -p ci-build "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci-build "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db" login.keychain
          security set-keychain-settings -t 3600 "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/tyvox.p12" -k "$RUNNER_TEMP/ci.keychain-db" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/tyvox.p12" -clcerts -nokeys \
            -passin "pass:$MAC_CERT_PASSWORD" -out "$RUNNER_TEMP/tyvox.crt"
          sudo security add-trusted-cert -d -r trustRoot -k "$RUNNER_TEMP/ci.keychain-db" "$RUNNER_TEMP/tyvox.crt"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci-build "$RUNNER_TEMP/ci.keychain-db"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag '$TAG' does not match packages/desktop version '$PKG'"
            exit 1
          fi

      - name: Build & Package
        run: pnpm ${{ matrix.pack_script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: ignore
          retention-days: 7
